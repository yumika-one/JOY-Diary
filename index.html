<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b32"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>JOY Diary</title>
<style>
:root{--navy:#071b32;--navy2:#0c2948;--ocean:#16697a;--aqua:#75c9c8;--gold:#d9b56d;--paper:#fffaf0;--paper2:#f7ecd2;--ink:#24313a;--mut:#6d7a82}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;padding:18px 14px 96px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 8%,rgba(117,201,200,.26),transparent 31%),radial-gradient(circle at 88% 18%,rgba(217,181,109,.17),transparent 25%),linear-gradient(160deg,var(--navy),var(--navy2) 55%,#0b4055)}button,input,textarea{font:inherit}.app{width:min(720px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin:0 4px 14px}.brand{font-weight:900;letter-spacing:.08em}.period{font-size:12px;opacity:.7}.iconbtn{border:0;background:transparent;color:#fff;font-size:20px}.wrap{perspective:1800px}.book{position:relative;min-height:590px;border-radius:12px 28px 28px 12px;background:linear-gradient(90deg,#ded0b2 0 3%,var(--paper) 5%,#fffdf8 54%,var(--paper2));box-shadow:0 28px 70px rgba(0,0,0,.28),inset 14px 0 26px rgba(87,62,29,.1);transform-origin:left center;overflow:hidden;animation:open .9s cubic-bezier(.2,.8,.2,1) both}.book:before{content:"";position:absolute;inset:0 auto 0 0;width:12px;background:linear-gradient(90deg,#59472f,#9c7b48,#d5b776);opacity:.75}.book.closing{animation:close 1s cubic-bezier(.5,0,.2,1) forwards}@keyframes open{from{transform:rotateY(-88deg) scale(.96);opacity:.2}to{transform:none;opacity:1}}@keyframes close{to{transform:rotateY(-88deg) scale(.96);opacity:.15}}.page{min-height:590px;padding:34px 24px 30px;display:flex;flex-direction:column}.kicker{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--ocean)}h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(28px,7vw,42px);line-height:1.38;margin:9px 0;color:var(--navy)}.intro{line-height:1.9;color:#4d5b64}.line{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px 0 22px}.date{display:inline-block;margin-top:6px;padding:7px 11px;border-radius:999px;background:rgba(22,105,122,.09);color:var(--ocean);font-weight:800;font-size:12px}.field{margin-bottom:18px}.field label{display:block;font-weight:900;line-height:1.75;margin-bottom:8px;color:var(--navy)}textarea{width:100%;min-height:112px;padding:14px 15px;border:1px solid rgba(22,105,122,.25);border-radius:16px;background:rgba(255,255,255,.68);color:var(--ink);line-height:1.75;resize:vertical;outline:none}textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,181,109,.17)}.note{font-size:12px;line-height:1.8;color:var(--mut);padding:12px 13px;border-radius:13px;background:rgba(117,201,200,.1)}.actions{display:grid;gap:10px;margin-top:auto;padding-top:18px}.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:900;background:linear-gradient(135deg,var(--ocean),#0e4c64);color:#fff;box-shadow:0 10px 22px rgba(14,76,100,.24)}.btn.gold{background:linear-gradient(135deg,#c99d4f,var(--gold));color:#172333}.btn.ghost{background:transparent;color:var(--ocean);border:1px solid rgba(22,105,122,.28);box-shadow:none}.status{font-size:13px;color:var(--mut);text-align:center;min-height:20px;margin-top:8px}.tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(680px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px;border-radius:22px;background:rgba(5,22,39,.9);backdrop-filter:blur(18px);box-shadow:0 14px 38px rgba(0,0,0,.28)}.tab{border:0;border-radius:15px;padding:11px 7px;background:transparent;color:rgba(255,255,255,.72);font-weight:900;font-size:12px}.tab.active{background:linear-gradient(135deg,rgba(117,201,200,.28),rgba(217,181,109,.28));color:#fff}.shelf{display:grid;gap:12px}.card{border:1px solid rgba(217,181,109,.25);border-radius:18px;padding:15px;background:linear-gradient(135deg,rgba(7,27,50,.96),rgba(12,64,80,.96));color:#fff}.card .title{font-family:Georgia,"Yu Mincho",serif;font-size:18px;font-weight:700}.card .meta{font-size:12px;opacity:.72;margin-top:6px;line-height:1.6}.card button{width:100%;margin-top:12px}.quote{font-family:Georgia,"Yu Mincho",serif;font-size:20px;line-height:1.9;text-align:center;color:var(--navy);padding:24px 8px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(2,12,23,.78);z-index:50}.modal.show{display:flex}.modalbox{width:min(440px,100%);padding:25px;border-radius:24px;background:var(--paper);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4)}.modalbox h3{font-family:Georgia,"Yu Mincho",serif;color:var(--navy);font-size:25px;margin:4px 0 12px}.modalbox p{line-height:1.8;color:#53616a}.settings{display:grid;gap:9px;margin:15px 0}.settings input{width:100%;padding:12px;border:1px solid rgba(22,105,122,.25);border-radius:13px}.empty{text-align:center;color:var(--mut);line-height:1.8;padding:35px 8px}@media(min-width:650px){.page{padding:48px 54px}.book,.page{min-height:660px}}
</style></head><body>
<main class="app"><div class="top"><div><div class="brand">JOY DIARY</div><div class="period">2026.07.30 — 09.12</div></div><button class="iconbtn" onclick="openSettings()">⚙︎</button></div><div class="wrap"><section class="book" id="book"><div class="page" id="page"></div></section></div></main>
<nav class="tabs"><button class="tab active" id="tabToday" onclick="showToday()">今日</button><button class="tab" id="tabIntent" onclick="showIntent()">最初の意図</button><button class="tab" id="tabShelf" onclick="showShelf()">本棚</button></nav>
<div class="modal" id="modal"><div class="modalbox"><h3 id="modalTitle"></h3><p id="modalText"></p><button class="btn gold" onclick="closeModal()">受け取った</button></div></div>
<div class="modal" id="settingsModal"><div class="modalbox"><h3>プレビュー設定</h3><p>公開前の確認用です。通常は実際の日付を使います。</p><div class="settings"><label><input type="checkbox" id="previewEnabled"> 日付を指定して確認</label><input type="date" id="previewDate"><input type="time" id="previewTime" value="12:00"></div><button class="btn" onclick="savePreview()">この日時で表示</button><button class="btn ghost" style="margin-top:10px" onclick="resetPreview()">実際の日付に戻す</button><button class="btn ghost" style="margin-top:10px" onclick="closeSettings()">閉じる</button></div></div>
<script>
const KEY="joy-diary-retreat-2026-v1",START="2026-07-30",FINAL=new Date("2026-09-12T19:00:00+09:00");
function base(){return{intention:{receive:"",feel:"",self:"",updatedAt:""},entries:{},finalAnswer:"",finalSaved:false,preview:{enabled:false,date:"2026-07-30",time:"12:00"}}}let state=(()=>{try{const r=JSON.parse(localStorage.getItem(KEY)||"null")||{};return Object.assign(base(),r,{intention:Object.assign(base().intention,r.intention||{}),entries:r.entries||{},preview:Object.assign(base().preview,r.preview||{})})}catch(e){return base()}})();
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function now(){return state.preview.enabled?new Date(`${state.preview.date}T${state.preview.time||"12:00"}:00+09:00`):new Date()}function parts(d=now()){const p=new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d),o={};p.forEach(x=>o[x.type]=x.value);return o}function key(d=now()){const p=parts(d);return `${p.year}-${p.month}-${p.day}`}function dparse(k){return new Date(`${k}T12:00:00+09:00`)}function diff(a,b){return Math.round((dparse(b)-dparse(a))/86400000)}function fmt(k){return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short"}).format(dparse(k))}function active(n){["Today","Intent","Shelf"].forEach(x=>$("tab"+x).classList.toggle("active",x.toLowerCase()===n))}function animate(fn){book.style.animation="none";void book.offsetWidth;book.style.animation="";fn()}
function info(k){if(k==="2026-07-31")return{k:"前日",t:"準備を楽しむ最終日"};if(k==="2026-08-01")return{k:"JOY RETREAT Day 1",t:"委ねて味わうを体験する1日"};if(k==="2026-08-02")return{k:"JOY RETREAT Day 2",t:"JOYの幅を体験する1日"};if(k==="2026-08-03")return{k:"JOY RETREAT Day 3",t:"今の自分で人生を意図する1日"};if(k>="2026-08-04"&&k<="2026-08-07"){let n=diff("2026-08-03",k);return{k:`After ${n}`,t:`余韻に浸る${n}日目`}}if(k==="2026-08-08")return{k:"After 5｜JOY ミーティング2回目",t:"リトリートから１週間の震えと気づき"};if(k>="2026-08-09"&&k<="2026-09-11"){let n=diff("2026-08-08",k);return{k:`After ${5+n}`,t:`委ねて受け取るを日常へ ${n}日目`}}if(k==="2026-09-12")return{k:"JOY RETREAT 最終日｜JOY ミーティング3回目",t:"今思う、あなたにとっての人生とは？"};return null}
function showToday(){active("today");let k=key();animate(()=>{if(k<START){page.innerHTML=`<div class="kicker">COMING SOON</div><h1>JOY Diary</h1><div class="line"></div><div class="quote">7月30日、<br>この一冊の旅が始まります。</div><div class="actions"><button class="btn ghost" onclick="showIntent()">プレビューを見る</button></div>`;return}if(k===START){renderIntent(true);return}if(k>="2026-07-31"&&k<="2026-09-11"){renderDay(k);return}if(k==="2026-09-12"){now()>=FINAL?renderFinal():renderDay(k,true);return}k>"2026-09-12"?(state.finalSaved?renderDone():renderFinal()):renderIntent(true)})}
function renderIntent(opening=false){let i=state.intention;page.innerHTML=`<div class="kicker">${opening?"JOY RETREATへようこそ":"最初の意図"}</div><h1>${opening?"この旅を、ここから意図する。":"今の自分に、意図を合わせ直す。"}</h1><p class="intro">${opening?"JOYミーティング①で意図したことを、まずこの一冊の最初に置きます。":"意図は固定するものではありません。受け取るたびに、今の自分にしっくりくる言葉へ何度でも更新できます。"}</p><div class="line"></div><div class="field"><label>この２泊３日で<br>何を受け取りたい？</label><textarea id="r">${esc(i.receive)}</textarea></div><div class="field"><label>この２泊３日で<br>何を感じたい？</label><textarea id="f">${esc(i.feel)}</textarea></div><div class="field"><label>さらに、このJOY RETREATプログラム全体を終えて<br>どんな自分を受け取りたい？</label><textarea id="s">${esc(i.self)}</textarea></div><div class="note">この意図は、9月12日までいつでも自由に書き換えられます。もう受け取れたと感じたら、今のあなたがもっと受け取りたいものへ、何度でも更新してください。</div><div class="actions"><button class="btn gold" onclick="saveIntent()">${opening?"この旅の最初に置く":"今の意図に更新する"}</button></div><div class="status" id="status">${i.updatedAt?`最終更新：${esc(i.updatedAt)}`:""}</div>`}
function saveIntent(){state.intention={receive:r.value.trim(),feel:f.value.trim(),self:s.value.trim(),updatedAt:new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",dateStyle:"medium",timeStyle:"short"}).format(now())};save();status.textContent="保存しました。いつでも、また書き換えられます。";pop("意図を置きました","これは決定ではなく、今のあなたの意図。旅の途中で何度でも育ててください。")}
function showIntent(){active("intent");animate(()=>renderIntent(false))}
function renderDay(k,waiting=false){let x=state.entries[k]||{imagine:"",joy:"",feeling:"",savedAt:""},i=info(k);page.innerHTML=`<div class="kicker">${esc(i.k)}</div><div class="date">${fmt(k)}</div><h1>${esc(i.t)}</h1>${waiting?'<div class="note">最後の特別なページは、JOYミーティング終了後の19:00に開きます。</div>':""}<div class="line"></div><div class="field"><label>今日、どんな自分でいたい？</label><textarea id="im" placeholder="出来事ではなく、今日体験したい自分を先に意図してみる。">${esc(x.imagine)}</textarea></div><div class="field"><label>今日、受け取ったJOYは？</label><textarea id="joy" placeholder="小さなことも、震えたことも、ここへ。">${esc(x.joy)}</textarea></div><div class="field"><label>今、何を感じている？</label><textarea id="feel" placeholder="答えを整えず、今ここにある感覚を。">${esc(x.feeling)}</textarea></div><div class="actions"><button class="btn" onclick="saveDay('${k}')">今日を受け取る</button></div><div class="status" id="status">${x.savedAt?`保存済み：${esc(x.savedAt)}`:""}</div>`}
function saveDay(k){state.entries[k]={...(state.entries[k]||{}),imagine:im.value,joy:joy.value,feeling:feel.value,savedAt:new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",dateStyle:"medium",timeStyle:"short"}).format(now())};save();status.textContent="今日のページを保存しました。";pop("今日を受け取りました","このページは本棚に残り、あとから何度でも読み返し・書き直しできます。")}
function renderFinal(){let i=state.intention;page.innerHTML=`<div class="kicker">JOY RETREAT 最終ページ</div><div class="date">9月12日（土）19:00 OPEN</div><h1>今思う、あなたにとっての人生とは？</h1><p class="intro">最初に置いた意図は、旅の途中で何度も育ってきました。今のあなたから、この一冊の最後の問いへ。</p><div class="line"></div><div class="note"><strong>今の意図</strong><br><br>この２泊３日で受け取りたいこと：<br>${esc(i.receive)||"—"}<br><br>この２泊３日で感じたいこと：<br>${esc(i.feel)||"—"}<br><br>このJOY RETREATプログラム全体を終えて受け取りたい自分：<br>${esc(i.self)||"—"}</div><div class="field" style="margin-top:20px"><label>今思う、あなたにとっての人生とは？</label><textarea id="final" style="min-height:180px">${esc(state.finalAnswer)}</textarea></div><div class="actions"><button class="btn gold" onclick="finish()">この人生を受け取り、本を閉じる</button></div>`}
function finish(){let a=final.value.trim();if(!a){pop("最後の言葉を置いてみて","今のあなたの言葉を、短くてもいいので残してみてください。");return}state.finalAnswer=a;state.finalSaved=true;save();book.classList.add("closing");setTimeout(()=>{book.classList.remove("closing");renderDone();pop("一冊の旅が完成しました","本は閉じても、この旅で受け取った感覚は、ここからの人生へ続いていきます。")},1000)}function renderDone(){page.innerHTML=`<div class="kicker">JOY RETREAT 2026</div><h1>一冊の旅が、完成しました。</h1><div class="line"></div><div class="quote">今思う、あなたにとっての人生とは？<br><br><strong>${esc(state.finalAnswer)}</strong></div><p class="intro" style="text-align:center">本は閉じても、あなたの人生は続いていきます。</p><div class="actions"><button class="btn ghost" onclick="showShelf()">本棚で旅を読み返す</button></div>`}
function showShelf(){active("shelf");animate(()=>{let c=[];if(state.intention.receive||state.intention.feel||state.intention.self)c.push(`<div class="card"><div class="title">最初の意図</div><div class="meta">今の自分に合わせて、何度でも更新できるページ</div><button class="btn gold" onclick="showIntent()">開く・編集する</button></div>`);Object.keys(state.entries).sort().forEach(k=>{let x=state.entries[k],i=info(k);if(!i)return;let t=x.joy||x.feeling||x.imagine||"";c.push(`<div class="card"><div class="title">${esc(i.t)}</div><div class="meta">${fmt(k)}｜${esc(i.k)}<br>${esc(t.slice(0,54))}${t.length>54?"…":""}</div><button class="btn ghost" onclick="openEntry('${k}')">ページを開く</button></div>`)});if(state.finalSaved)c.push(`<div class="card" style="border-color:var(--gold)"><div class="title">JOY RETREAT 完了</div><div class="meta">今思う、あなたにとっての人生とは？</div><button class="btn gold" onclick="renderDone()">最後のページを開く</button></div>`);page.innerHTML=`<div class="kicker">BOOKSHELF</div><h1>あなたが受け取った日々</h1><div class="line"></div><div class="shelf">${c.join("")||'<div class="empty">まだ本棚にページはありません。<br>書いた日々が、ここに残ります。</div>'}</div>`})}function openEntry(k){active("");animate(()=>renderDay(k))}
function pop(t,x){modalTitle.textContent=t;modalText.textContent=x;modal.classList.add("show")}function closeModal(){modal.classList.remove("show")}function openSettings(){previewEnabled.checked=state.preview.enabled;previewDate.value=state.preview.date;previewTime.value=state.preview.time;settingsModal.classList.add("show")}function closeSettings(){settingsModal.classList.remove("show")}function savePreview(){state.preview={enabled:previewEnabled.checked,date:previewDate.value||"2026-07-30",time:previewTime.value||"12:00"};save();closeSettings();showToday()}function resetPreview(){state.preview.enabled=false;save();closeSettings();showToday()}if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));showToday();
</script></body></html>
