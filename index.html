<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a2f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><title>JOY Diary</title><style>
:root{--navy:#071a2f;--navy2:#0d2943;--gold:#c9a55c;--paper:#f5eedf;--paper2:#ede2ce;--ink:#23313a;--line:rgba(82,66,42,.18);--shadow:0 22px 70px rgba(0,0,0,.34)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,serif;color:var(--ink)}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(72,132,160,.38),transparent 38%),linear-gradient(180deg,var(--navy2),var(--navy));padding:20px 14px 104px;overflow-x:hidden}button,textarea,input{font:inherit}button{cursor:pointer}.shell{width:min(980px,100%);margin:auto}.outside-title{text-align:center;color:#f5e8c8;letter-spacing:.16em;font-size:18px;margin-bottom:4px}.period{text-align:center;color:rgba(245,232,200,.64);font:12px/1.4 system-ui,sans-serif;letter-spacing:.14em;margin-bottom:18px}.book{position:relative;width:100%;min-height:650px;background:linear-gradient(90deg,#e6d7bd 0 49.5%,#d4c1a2 49.9% 50.1%,#f0e6d3 50.5%);border-radius:10px 18px 18px 10px;box-shadow:var(--shadow);overflow:hidden;animation:openBook .78s cubic-bezier(.2,.7,.1,1) both}@keyframes openBook{from{transform:rotateX(7deg) scale(.93);opacity:0}to{transform:none;opacity:1}}.book:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.22;background-image:repeating-linear-gradient(0deg,rgba(85,70,45,.04) 0 1px,transparent 1px 4px),radial-gradient(circle at 30% 30%,rgba(255,255,255,.65),transparent 42%);mix-blend-mode:multiply}.book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:34px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(56,39,21,.16),rgba(255,255,255,.2),transparent);pointer-events:none;z-index:5}.spread{display:grid;grid-template-columns:1fr 1fr;min-height:650px;position:relative;z-index:2}.page{padding:56px 52px;display:flex;flex-direction:column;position:relative}.page.left{background:linear-gradient(105deg,var(--paper2),var(--paper))}.page.right{background:linear-gradient(75deg,var(--paper),#faf4e9)}.date{font:12px/1.3 system-ui,sans-serif;color:var(--gold);letter-spacing:.14em;margin-bottom:42px}.kicker{font-size:14px;color:var(--gold);letter-spacing:.08em;margin-bottom:12px}h1,h2,p{margin:0}h1{font-size:clamp(28px,4.8vw,46px);line-height:1.48;font-weight:500;letter-spacing:.04em}h2{font-size:clamp(22px,3.8vw,34px);line-height:1.55;font-weight:500}.poem{margin-top:28px;font-size:clamp(16px,2.2vw,20px);line-height:2;color:#4e5350}.question{font-size:clamp(24px,4vw,39px);line-height:1.55;font-weight:500;margin-bottom:28px}textarea{width:100%;min-height:220px;resize:vertical;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;font-size:19px;line-height:1.85;color:var(--ink);outline:none}.primary{align-self:flex-start;margin-top:24px;border:1px solid var(--gold);background:transparent;color:#6f592d;padding:13px 22px;border-radius:999px;letter-spacing:.08em}.saved-intent{margin-top:12px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:22px;line-height:1.8;white-space:pre-wrap;display:none}.reflection{margin-top:42px}.reflection label{display:block;font-size:16px;color:#756c5f;margin-bottom:8px}.small-textarea{min-height:130px;font-size:17px}.journey-list{display:grid;gap:10px;margin-top:6px}.journey-item{width:100%;display:grid;grid-template-columns:64px 1fr 24px;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:13px 0;color:var(--ink)}.journey-item .d{font:12px/1.2 system-ui,sans-serif;color:var(--gold)}.journey-item .t{font-size:15px;line-height:1.5}.journey-item .lock{font:13px/1 system-ui,sans-serif;color:#9e9484}.journey-item.locked{opacity:.48;cursor:default}.empty-note{margin-top:auto;color:#8d8373;font-size:14px;line-height:1.9}.tabs{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);padding:7px;background:rgba(7,26,47,.82);backdrop-filter:blur(16px);border:1px solid rgba(201,165,92,.28);border-radius:22px;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.28)}.tab{border:0;background:transparent;color:rgba(245,232,200,.65);padding:12px 8px;border-radius:16px;font:13px/1 system-ui,sans-serif}.tab.active{background:rgba(245,238,223,.12);color:#f5e8c8}.panel{display:none}.panel.active{display:block;animation:pageIn .42s ease both}@keyframes pageIn{from{opacity:.2;transform:translateX(12px)}to{opacity:1;transform:none}}.gear{position:fixed;right:14px;top:14px;border:1px solid rgba(245,232,200,.28);background:rgba(7,26,47,.56);color:#f5e8c8;width:40px;height:40px;border-radius:50%;z-index:40}.settings{position:fixed;inset:0;background:rgba(2,11,22,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.settings.open{display:flex}.settings-card{width:min(430px,100%);background:#f5eedf;border-radius:18px;padding:24px;box-shadow:var(--shadow)}.settings-card h3{margin:0 0 18px;font-size:20px}.settings-card label{display:block;font:13px/1.4 system-ui,sans-serif;color:#71695f;margin:12px 0 6px}.settings-card input{width:100%;padding:12px;border:1px solid #d7c9b3;border-radius:10px;background:#fffaf0}.settings-actions{display:flex;gap:10px;margin-top:18px}.settings-actions button{flex:1;padding:12px;border-radius:999px;border:1px solid #b99a5a;background:transparent}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:#f5eedf;color:#26323a;padding:11px 18px;border-radius:999px;z-index:60;transition:.25s ease;font:13px/1.2 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.25)}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){body{padding:12px 10px 96px}.outside-title{font-size:15px;margin-top:4px}.period{margin-bottom:12px}.book{min-height:720px}.spread{grid-template-columns:1fr;min-height:720px}.page{padding:38px 28px;min-height:360px}.page.left{border-bottom:1px solid rgba(82,66,42,.18)}.book:after{display:none}.date{margin-bottom:24px}textarea{min-height:170px}.saved-intent{font-size:19px}}
</style></head><body><button class="gear" aria-label="設定" onclick="toggleSettings(true)">⚙</button><main class="shell"><div class="outside-title">JOY DIARY</div><div class="period">2026.07.30 — 09.12</div><section class="book">
<div class="panel active" id="panelToday"><div class="spread"><article class="page left"><div class="date" id="todayDate"></div><div class="kicker">今日の意図</div><h1>今日、<br>何を感じたい？</h1><div class="saved-intent" id="todayIntentDisplay"></div><div class="empty-note" id="todayHint">その意図を胸に、<br>この一日を歩いてみよう。</div></article><article class="page right"><div class="question">今日、受け取ったJOY</div><textarea id="joyInput"></textarea><div class="reflection"><label>今、何を感じている？</label><textarea id="feelingInput" class="small-textarea"></textarea></div><button class="primary" onclick="saveTodayReflection()">保存</button></article></div></div>
<div class="panel" id="panelIntent"><div class="spread"><article class="page left"><div class="date">旅の意図</div><h1>今日、<br>何を感じたい？</h1><p class="poem">その意図を胸に、<br>この一日を歩いてみよう。</p></article><article class="page right"><textarea id="intentInput"></textarea><button class="primary" onclick="changeIntent()">この意図に変更</button></article></div></div>
<div class="panel" id="panelBook"><div class="spread"><article class="page left"><div class="date">2026.07.30 — 09.12</div><h2>この一冊の旅</h2><div class="journey-list" id="journeyList"></div></article><article class="page right" id="journeyPreview"><div class="date">PAGE</div><h2>ページを選んでください</h2><p class="poem">未来のページは、<br>その日が来たらひらきます。</p></article></div></div>
</section></main><nav class="tabs"><button class="tab active" id="tabToday" onclick="showPanel('Today')">今日</button><button class="tab" id="tabIntent" onclick="showPanel('Intent')">今日の意図</button><button class="tab" id="tabBook" onclick="showPanel('Book')">本棚</button></nav>
<div class="settings" id="settings"><div class="settings-card"><h3>設定</h3><label for="previewDate">日付プレビュー</label><input type="date" id="previewDate" min="2026-07-30" max="2026-09-12"><div class="settings-actions"><button onclick="applyPreviewDate()">表示</button><button onclick="resetPreviewDate()">今日に戻す</button></div><div class="settings-actions"><button onclick="toggleSettings(false)">閉じる</button></div></div></div><div class="toast" id="toast"></div>
<script>
const STORAGE_KEY='joy-diary-2026-v2';let previewDate=null;const state=(()=>{try{return Object.assign({intent:'',days:{}},JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'))}catch(e){return{intent:'',days:{}}}})();const persist=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state));const localISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const activeDate=()=>previewDate?new Date(previewDate+'T12:00:00+09:00'):new Date();const formatDate=d=>new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(d);
function showPanel(name){['Today','Intent','Book'].forEach(n=>{document.getElementById('panel'+n).classList.toggle('active',n===name);document.getElementById('tab'+n).classList.toggle('active',n===name)});if(name==='Today')renderToday();if(name==='Intent')renderIntent();if(name==='Book')renderJourney()}
function renderIntent(){intentInput.value=state.intent||''}function changeIntent(){state.intent=intentInput.value.trim();persist();renderToday();toast(state.intent?'今日の意図を更新しました':'意図を空にしました')}
function renderToday(){const d=activeDate(),key=localISO(d),entry=state.days[key]||{};todayDate.textContent=formatDate(d);if(state.intent){todayIntentDisplay.textContent=state.intent;todayIntentDisplay.style.display='block';todayHint.style.display='none'}else{todayIntentDisplay.style.display='none';todayHint.style.display='block'}joyInput.value=entry.joy||'';feelingInput.value=entry.feeling||''}
function saveTodayReflection(){const key=localISO(activeDate());state.days[key]={...(state.days[key]||{}),joy:joyInput.value,feeling:feelingInput.value};persist();toast('保存しました')}
const pages=[{date:'2026-07-30',label:'7/30',title:'旅の意図'},{date:'2026-07-31',label:'7/31',title:'準備を楽しむ最終日'},{date:'2026-08-01',label:'8/1',title:'委ねて味わうを体験する1日'},{date:'2026-08-02',label:'8/2',title:'JOYの幅を体験する1日'},{date:'2026-08-03',label:'8/3',title:'今の自分で人生を意図する1日'},{date:'2026-08-04',label:'8/4〜',title:'余韻…'},{date:'2026-08-08',label:'8/8',title:'JOY Meeting②'},{date:'2026-08-09',label:'8/9〜',title:'委ねて受け取るを日常へ…'},{date:'2026-09-12',label:'9/12',title:'JOY Meeting③'},{date:'2026-09-12T19:00:00+09:00',label:'FINAL',title:'今思う、あなたにとっての人生とは？',final:true}];
function isUnlocked(p){return activeDate()>=new Date(p.date.includes('T')?p.date:p.date+'T00:00:00+09:00')}function renderJourney(){journeyList.innerHTML=pages.map((p,i)=>{const u=isUnlocked(p);return `<button class="journey-item ${u?'':'locked'}" ${u?`onclick="openJourney(${i})"`:'disabled'}><span class="d">${p.label}</span><span class="t">${p.title}</span><span class="lock">${u?'›':'○'}</span></button>`}).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openJourney(i){const p=pages[i],target=journeyPreview;if(p.final){target.innerHTML=`<div class="date">FINAL PAGE</div><div class="kicker">旅の意図</div><div class="saved-intent" style="display:block">${esc(state.intent||'')}</div><div class="question" style="margin-top:38px">今思う、<br>あなたにとっての人生とは？</div><textarea id="finalAnswer"></textarea><button class="primary" onclick="saveFinal()">Todayを受け取る</button>`;requestAnimationFrame(()=>finalAnswer.value=state.finalAnswer||'')}else{const key=p.date.slice(0,10),e=state.days[key]||{};target.innerHTML=`<div class="date">${p.label}</div><h2>${p.title}</h2><div class="reflection"><label>今日、受け取ったJOY</label><textarea class="small-textarea" id="archiveJoy">${esc(e.joy||'')}</textarea></div><div class="reflection"><label>今、何を感じている？</label><textarea class="small-textarea" id="archiveFeeling">${esc(e.feeling||'')}</textarea></div><button class="primary" onclick="saveArchive('${key}')">保存</button>`}}
function saveArchive(k){state.days[k]={...(state.days[k]||{}),joy:archiveJoy.value,feeling:archiveFeeling.value};persist();toast('保存しました')}function saveFinal(){state.finalAnswer=finalAnswer.value;state.completed=true;persist();toast('Todayを受け取りました')}
function toggleSettings(v){settings.classList.toggle('open',v)}function applyPreviewDate(){if(previewDate=document.getElementById('previewDate').value){toggleSettings(false);renderToday();renderJourney();toast('日付プレビュー中')}}function resetPreviewDate(){previewDate=null;document.getElementById('previewDate').value='';toggleSettings(false);renderToday();renderJourney();toast('今日に戻しました')}function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('show'),1600)}settings.addEventListener('click',e=>{if(e.target.id==='settings')toggleSettings(false)});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderIntent();renderToday();renderJourney();
</script></body></html>
