<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eee4">
<link rel="manifest" href="./manifest.webmanifest?v=v15">
<title>JOY Diary · v0.15</title>
<style>
:root{
  --paper:#fffaf1;--paper-deep:#f5ecdf;--ink:#342d27;--muted:#786f66;
  --pink:#d9a4a9;--mint:#a8bcae;--gold:#c6a56a;--line:rgba(67,50,35,.14);
  --shadow:0 28px 78px rgba(55,39,27,.21);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif}
body{
  background:
    radial-gradient(circle at 12% 6%,rgba(255,255,255,.84),transparent 25%),
    linear-gradient(135deg,#d7d0c6,#eee7dc 52%,#c9c1b6);
}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
.app{min-height:100vh;padding:14px 14px 34px}
.top{
  max-width:1040px;margin:auto;display:flex;justify-content:space-between;align-items:center;
  padding:4px 4px 14px
}
.brand{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:18px;letter-spacing:.07em}
.round{
  width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.76);
  box-shadow:0 5px 18px rgba(51,34,17,.13)
}
.book{
  position:relative;max-width:1020px;min-height:710px;margin:auto;overflow:hidden;
  border-radius:20px 28px 28px 20px;box-shadow:var(--shadow);
  background:
    radial-gradient(circle at 18% 12%,rgba(133,103,67,.035),transparent 24%),
    repeating-linear-gradient(0deg,rgba(86,59,32,.02) 0 1px,transparent 1px 4px),
    linear-gradient(90deg,#eadfce 0,#fffaf1 4.5%,#fffaf1 95.5%,#eadfce 100%);
  animation:open .65s cubic-bezier(.2,.8,.2,1) both
}
@keyframes open{from{opacity:.15;transform:perspective(1200px) rotateY(-8deg) scale(.985)}to{opacity:1;transform:none}}
.book:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;
  background:radial-gradient(circle at 82% 92%,rgba(103,74,44,.14),transparent 24%)
}
.rings{
  position:absolute;left:calc(50% - 8px);top:50px;bottom:50px;width:16px;z-index:8;
  display:flex;flex-direction:column;justify-content:space-around;pointer-events:none
}
.rings i{
  height:26px;border:3px solid rgba(66,58,51,.45);border-left:0;
  border-radius:0 15px 15px 0;background:rgba(255,255,255,.24)
}
.page{
  display:none;position:relative;z-index:2;min-height:710px;padding:56px 68px 72px;
  animation:flip .4s ease
}
.page.active{display:block}
@keyframes flip{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.spread{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:104px;min-height:570px
}
.left,.right{align-self:center;min-width:0}
.left{padding-right:3px}.right{padding-left:3px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:17px}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-weight:500}
.logo{
  font-family:Georgia,"Times New Roman","Yu Mincho",serif;
  font-size:clamp(52px,7.4vw,84px);font-style:italic;font-weight:400;
  line-height:.98;letter-spacing:-.055em;white-space:nowrap
}
.logo span{font-size:.78em;font-style:normal;letter-spacing:-.035em}
h2{font-size:clamp(28px,3.8vw,44px);line-height:1.42;letter-spacing:-.025em;word-break:keep-all}
h3{font-size:25px;line-height:1.5}
.copy{font-size:clamp(15px,1.65vw,19px);line-height:2}
.body{font-size:14px;line-height:1.95;color:#514a44}
.note{
  font-family:"Segoe Print","Bradley Hand","Comic Sans MS","Yu Gothic",cursive;
  font-size:13px;color:#776e66;letter-spacing:.015em
}
.cover-left{display:flex;flex-direction:column;justify-content:center}
.cover-left>p{font-family:Georgia,"Yu Mincho",serif;letter-spacing:.12em}
.watercolor{
  width:min(390px,92%);aspect-ratio:1;margin:auto;position:relative;border-radius:50%;
  background:
    radial-gradient(circle at 34% 36%,rgba(235,126,138,.78),transparent 23%),
    radial-gradient(circle at 66% 35%,rgba(246,196,104,.78),transparent 24%),
    radial-gradient(circle at 52% 66%,rgba(117,168,143,.67),transparent 27%),
    radial-gradient(circle at 31% 72%,rgba(123,150,178,.48),transparent 24%),
    radial-gradient(circle at 72% 68%,rgba(218,152,178,.48),transparent 22%),
    rgba(255,255,255,.15);
  filter:blur(.2px) drop-shadow(0 14px 22px rgba(58,41,27,.14));
  opacity:.9
}
.watercolor:after{
  content:"";position:absolute;inset:7%;border-radius:44% 56% 48% 52%;
  border:1px solid rgba(255,255,255,.42);transform:rotate(-8deg)
}
.field{margin:19px 0}
label{display:block;font-size:14px;line-height:1.75;margin-bottom:7px}
textarea{
  width:100%;min-height:80px;padding:11px 4px;border:0;border-bottom:1px solid var(--line);
  background:transparent;outline:0;resize:vertical;line-height:1.8;color:var(--ink)
}
textarea:focus{border-color:var(--gold)}
.card{
  padding:25px;border:1px solid var(--line);border-radius:20px;
  background:rgba(255,255,255,.4);box-shadow:0 13px 32px rgba(75,53,34,.05)
}
.prompt{font:500 clamp(22px,3vw,34px)/1.5 Georgia,"Yu Mincho",serif;word-break:keep-all}
.badge{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  background:rgba(198,165,106,.15);font-size:12px;letter-spacing:.06em;margin-bottom:15px
}
.intro{max-width:780px;margin:auto}
.intro-text{padding:20px 0 5px;max-width:660px}
.intro-text strong{font-family:Georgia,"Yu Mincho",serif;font-weight:500}
.notice{font-size:12px;line-height:1.8;color:var(--muted);border-left:2px solid var(--gold);padding-left:12px;margin-top:18px}
.journey-wrap{max-width:820px;margin:auto}
.timeline{position:relative;margin-top:24px;padding-left:26px}
.timeline:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--pink),var(--mint),var(--gold))}
.stop{position:relative;padding:0 0 26px 23px}
.stop:before{
  content:"";position:absolute;left:-25px;top:7px;width:13px;height:13px;border-radius:50%;
  background:var(--paper);border:3px solid var(--pink);box-shadow:0 0 0 5px rgba(217,164,169,.12)
}
.stop.after:before{border-color:var(--mint);box-shadow:0 0 0 5px rgba(168,188,174,.13)}
.stop.meeting:before{border-color:var(--gold);box-shadow:0 0 0 6px rgba(198,165,106,.15)}
.stop-date{font-size:11px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
.stop-title{font-family:Georgia,"Yu Mincho",serif;font-size:22px;line-height:1.45;margin:4px 0}
.stop-copy{font-size:14px;line-height:1.8;color:#514a44;margin:0}
.chapter{
  display:inline-block;margin:20px 0 14px;padding:6px 11px;border-radius:999px;
  font-size:11px;letter-spacing:.16em;background:rgba(168,188,174,.14)
}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px 0}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid #fff9;box-shadow:0 3px 9px #0002}
.sw.sel{outline:3px solid var(--ink);outline-offset:3px}
.water{height:150px;border:1px solid var(--line);border-radius:17px;background:#fffaf2;overflow:hidden;position:relative}
.blob{position:absolute;inset:21px 36px;border-radius:50% 43% 55% 46%;opacity:.7;filter:blur(1px);transform:rotate(-5deg)}
.nav{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:17px}
.pill{border:0;border-radius:999px;padding:12px 22px;background:#ffffffc8;box-shadow:0 5px 18px #33221122}
.pill:disabled{opacity:.34}.dark{background:var(--ink);color:#fff}
.num{font-size:12px;min-width:90px;text-align:center}
.overlay{display:none;position:fixed;z-index:30;inset:0;padding:28px;background:#2a211a55;backdrop-filter:blur(8px)}
.overlay.open{display:block}
.panel{max-width:960px;max-height:90vh;overflow:auto;margin:auto;background:var(--paper);border-radius:24px;padding:28px;box-shadow:0 24px 70px #21180f55}
.phead{display:flex;justify-content:space-between;align-items:center}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px}
.thumb{
  position:relative;min-height:155px;border:0;border-radius:8px 16px 16px 8px;
  padding:15px;text-align:left;background:#efd8c0;box-shadow:7px 9px 20px #3223162b
}
.thumb:nth-child(4n+2){background:#c7d8d1}.thumb:nth-child(4n+3){background:#e3b6b8}.thumb:nth-child(4n){background:#e7c38f}
.thumb.lock{filter:grayscale(.7);opacity:.55}
.tname{font:18px Georgia,serif;margin-top:9px}
.settings{margin:18px 0;padding:18px;border:1px solid var(--line);border-radius:16px}
input[type=date]{padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
.footer{text-align:center;font-size:12px;color:#655e57;margin-top:18px}
.toast{display:none;position:fixed;z-index:60;left:50%;bottom:24px;transform:translateX(-50%);background:#2f2b27;color:#fff;padding:10px 18px;border-radius:999px}


/* v0.6 — 今日を生きる */
.preview-note{
  margin:10px 0 18px;padding:10px 13px;border-radius:12px;
  background:rgba(168,188,174,.13);color:var(--muted);font-size:12px;line-height:1.6
}
.save-received{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);
  z-index:1000;padding:10px 16px;border-radius:999px;background:rgba(54,45,38,.92);color:#fff;
  font-size:12px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.25s ease
}
.save-received.show{opacity:1;transform:translate(-50%,0)}

.progress-card{
  margin:20px 0 4px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,.54),rgba(168,188,174,.10))
}
.progress-label{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:10px}
.progress-track{height:7px;border-radius:999px;background:rgba(66,53,42,.10);overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--mint),var(--gold));border-radius:999px;transition:width .45s ease}
.progress-copy{font-family:Georgia,"Yu Mincho",serif;font-size:16px;line-height:1.7;margin:10px 0 0}
.stop.past{opacity:.72}
.stop.past:before{content:"✓";display:grid;place-items:center;color:#fff;font-size:9px;background:var(--mint);border-color:var(--mint)}
.stop.current{
  cursor:pointer;
  margin-left:-4px;padding:16px 18px 18px 19px;border:1px solid rgba(198,165,106,.35);
  border-radius:17px;background:rgba(198,165,106,.10);box-shadow:0 10px 26px rgba(87,63,33,.07)
}
.stop.current:before{background:var(--gold);border-color:#fff;box-shadow:0 0 0 6px rgba(198,165,106,.18)}
.stop.future{opacity:.42}
.now-tag{
  display:inline-block;margin-left:7px;padding:3px 8px;border-radius:999px;
  background:var(--gold);color:white;font:10px/1.4 system-ui,sans-serif;letter-spacing:.07em;vertical-align:middle
}
.today-focus{
  margin:12px 0 22px;padding:18px 20px;border-left:3px solid var(--gold);
  background:rgba(198,165,106,.08);border-radius:0 16px 16px 0
}
.today-focus b{font-family:Georgia,"Yu Mincho",serif;font-size:18px;font-weight:500}
.optional-label{
  display:inline-block;margin-left:8px;padding:2px 7px;border-radius:999px;
  font-size:10px;background:rgba(168,188,174,.18);color:var(--muted);vertical-align:middle
}
.intention-echo{
  margin:22px 0;padding:20px;border-radius:18px;border:1px solid rgba(198,165,106,.30);
  background:linear-gradient(135deg,rgba(198,165,106,.12),rgba(255,255,255,.44))
}
.intention-echo .quote{font-family:Georgia,"Yu Mincho",serif;font-size:18px;line-height:1.7}
.shelf-intro{font-size:13px;line-height:1.8;color:var(--muted);margin:-8px 0 20px}
.thumb{transition:transform .2s ease,box-shadow .2s ease}
.thumb:not(.lock):hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:9px 14px 26px #32231632}
.thumb .chapter-mark{position:absolute;left:12px;bottom:11px;font-size:9px;letter-spacing:.11em;opacity:.58}

@media(max-width:760px){
  body{background:#efe9df}
  .app{padding:0 0 82px}
  .top{padding:12px 16px;background:rgba(255,250,241,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .brand{font-size:16px}
  .book{
    min-height:calc(100vh - 140px);width:100%;border-radius:0;box-shadow:none;
    background:
      radial-gradient(circle at 82% 5%,rgba(217,164,169,.1),transparent 20%),
      repeating-linear-gradient(0deg,rgba(86,59,32,.018) 0 1px,transparent 1px 4px),
      var(--paper)
  }
  .page{min-height:calc(100vh - 140px);padding:40px 28px 58px}
  .spread{grid-template-columns:1fr;gap:30px;min-height:auto}
  .left,.right{padding:0}
  .rings{display:none}
  .logo{font-size:clamp(48px,16vw,70px);white-space:normal}
  h2{font-size:clamp(27px,7.5vw,36px);line-height:1.46}
  .copy{font-size:16px;line-height:1.95}
  .watercolor{width:min(265px,78vw)}
  .cover-left{text-align:center}.cover-left .eyebrow{display:none}
  .note{text-align:center}
  .nav{position:fixed;z-index:24;left:0;right:0;bottom:0;margin:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,250,241,.97);border-top:1px solid var(--line)}
  .pill{padding:10px 16px}
  .footer{display:none}
  .card{padding:21px}
  .prompt{font-size:26px}
  .timeline{padding-left:23px}.stop{padding-left:18px}
}

/* v0.8 — 旅の物語を完成させる */
.daily-spread{align-items:start}
.daily-heading{margin:8px 0 28px}
.daily-date{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:clamp(28px,5vw,48px);line-height:1;margin:0 0 10px}
.daily-kicker{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:700}
.daily-title{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:clamp(28px,5vw,50px);line-height:1.28;margin:22px 0 8px;overflow-wrap:anywhere}
.daily-subtitle{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(16px,2.3vw,22px);line-height:1.75;margin:0;color:var(--ink)}
.daily-story{margin:22px 0 30px;padding:20px 22px;border-left:2px solid var(--gold);background:rgba(255,255,255,.42);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;line-height:2}
.daily-story p{margin:0 0 12px}.daily-story p:last-child{margin-bottom:0}
.daily-fields{display:grid;gap:24px}
.daily-field label{display:block;margin-bottom:9px;font-size:15px}
.daily-field textarea{min-height:128px}
.time-label{display:inline-block;margin-right:7px;font-family:Georgia,"Times New Roman",serif;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.little-card{padding:24px}
.little-card .eyebrow{font-size:10px;letter-spacing:.14em;overflow-wrap:anywhere}
.little-card .prompt{font-size:clamp(20px,3.5vw,31px);line-height:1.45;overflow-wrap:anywhere;word-break:normal}
.final-question-title{font-family:Georgia,"Times New Roman","Yu Mincho",serif;font-size:clamp(32px,6vw,58px);line-height:1.3;margin:18px 0 28px}
@media(max-width:720px){
  .daily-heading{margin-bottom:22px}
  .daily-title{font-size:30px}
  .daily-subtitle{font-size:17px}
  .daily-story{padding:17px 16px;line-height:1.9}
  .little-card{padding:19px 17px}
  .little-card .prompt{font-size:22px}
  .daily-field textarea{min-height:116px}
}



/* =========================================================
   v0.11 — Prototype of Atmosphere
   朝、窓を開けたような空気。水彩・紙・光の試作。
   ========================================================= */
:root{
  --paper:#fffaf2;
  --paper-deep:#f2e6d8;
  --ink:#332c27;
  --muted:#81766d;
  --pink:#e29ba8;
  --mint:#9ebdae;
  --gold:#d9aa68;
  --sky:#91b7c9;
  --coral:#ed8f64;
  --line:rgba(76,54,37,.12);
  --shadow:0 34px 95px rgba(59,40,27,.20),0 4px 18px rgba(70,49,34,.10);
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 9% 8%,rgba(255,248,241,.94) 0 8%,transparent 31%),
    radial-gradient(circle at 92% 13%,rgba(231,190,172,.29),transparent 30%),
    radial-gradient(circle at 80% 92%,rgba(145,183,201,.19),transparent 32%),
    linear-gradient(145deg,#d9d0c4 0%,#efe7dc 47%,#cec5ba 100%);
  background-attachment:fixed;
}
body:before,body:after{
  content:"";position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(28px);opacity:.38
}
body:before{width:38vw;height:38vw;left:-11vw;bottom:-12vw;background:rgba(226,155,168,.42)}
body:after{width:32vw;height:32vw;right:-8vw;top:-8vw;background:rgba(158,189,174,.38)}
.app{padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(38px,env(safe-area-inset-bottom))}
.top{max-width:1080px;padding:5px 8px 18px}
.brand{
  font-size:17px;letter-spacing:.13em;color:rgba(51,44,39,.82);
  text-shadow:0 1px 0 rgba(255,255,255,.75)
}
.round,.pill{
  border:1px solid rgba(255,255,255,.62);
  background:rgba(255,252,247,.70);
  box-shadow:0 8px 24px rgba(63,43,29,.11),inset 0 1px rgba(255,255,255,.8);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease
}
.round:hover,.pill:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(63,43,29,.15);background:rgba(255,252,247,.9)}
.round:active,.pill:active{transform:translateY(0) scale(.98)}
.book{
  max-width:1060px;min-height:735px;border-radius:24px 34px 34px 22px;
  background:
    linear-gradient(90deg,rgba(110,76,50,.09),transparent 4.5%,transparent 95.5%,rgba(110,76,50,.09)),
    radial-gradient(circle at 8% 15%,rgba(237,143,100,.075),transparent 25%),
    radial-gradient(circle at 91% 87%,rgba(145,183,201,.085),transparent 26%),
    repeating-linear-gradient(0deg,rgba(89,61,37,.018) 0 1px,transparent 1px 4px),
    linear-gradient(95deg,#eee3d4 0,#fffaf2 4.2%,#fffdf7 49.5%,#ebdfd0 50%,#fffdf7 50.7%,#fffaf2 95.8%,#eee3d4 100%);
  box-shadow:var(--shadow);
}
.book:before{
  content:"";position:absolute;z-index:1;inset:0;pointer-events:none;opacity:.17;mix-blend-mode:multiply;
  background-image:url("./assets/art/art-03.jpg");background-size:cover;background-position:center;
  filter:saturate(.65) contrast(.8);mask-image:linear-gradient(115deg,rgba(0,0,0,.38),transparent 34%,transparent 70%,rgba(0,0,0,.24));
  -webkit-mask-image:linear-gradient(115deg,rgba(0,0,0,.38),transparent 34%,transparent 70%,rgba(0,0,0,.24))
}
.book:after{opacity:.18;background:
  radial-gradient(circle at 18% 8%,rgba(231,166,122,.22),transparent 22%),
  radial-gradient(circle at 87% 93%,rgba(120,170,164,.18),transparent 27%)}
.rings{filter:drop-shadow(1px 2px 2px rgba(50,39,31,.18))}
.rings i{border-color:rgba(89,80,71,.40);background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.62),rgba(160,150,140,.2))}
.page{min-height:735px;padding:64px 74px 78px}
.spread{column-gap:112px;min-height:590px}
.eyebrow{
  font-size:10px;letter-spacing:.27em;color:#8c7e73;text-transform:uppercase;
  display:flex;align-items:center;gap:10px
}
.eyebrow:after{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
h1,h2,h3,.prompt,.stop-title,.tname{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif}
.logo{font-size:clamp(56px,7.6vw,88px);line-height:.94;color:#2f2925;text-shadow:0 2px 0 rgba(255,255,255,.65)}
h2{font-size:clamp(30px,4.1vw,47px);line-height:1.48;letter-spacing:-.035em}
h3{letter-spacing:.01em}
.copy{line-height:2.15;letter-spacing:.025em}
.body{line-height:2.05;color:#595049}
.note{color:#897a70;transform:rotate(-1.2deg);transform-origin:left center}
.watercolor{
  width:min(410px,94%);border-radius:44% 56% 48% 52%/52% 43% 57% 48%;
  background-image:
    linear-gradient(rgba(255,255,255,.04),rgba(255,255,255,.04)),
    url("./assets/art/art-01.jpg");
  background-size:cover;background-position:center;
  filter:saturate(.92) contrast(.92) brightness(1.05) drop-shadow(0 22px 30px rgba(58,41,27,.15));

function cover(){
return `<article class="page cover-page">
  <div class="cover-action"><button class="pill cover-start" id="coverStart">はじめる →</button></div>
</article>`}
function opening(){
return `<article class="page opening-page">
  <div class="opening-content">
    <div class="opening-copy-block">
      <div class="eyebrow">OPENING INTENTION</div>
      <h2>この旅の始まりに、<br>意図を置く。</h2>
      <p class="body">前回のJOY Meetingで決めた意図を、<br>ここに書き込んでみましょう。</p>
      <p class="body">ここでは、あなたが<strong>意図的創造者として生きること</strong>をサポートします。<br>フィーリングをゴールに歩んでいきましょう。</p>
      <p class="note">この意図は、旅の途中でいつでも書き直せます。</p>
    </div>
    <div class="opening-fields">
      <div class="field art-field art-field-pink">
        <label><b>このプログラムを終えて、どんな自分を受け取りたいですか？</b></label>
        ${field("open1","今のあなたの言葉で。")}
      </div>
      <div class="field art-field art-field-yellow">
        <label><b>このプログラムでは、どんなフィーリングを大切に過ごしますか？</b></label>
        ${field("open2","心地よさ、自由、安心、JOY…。")}
      </div>
      <button class="pill cover-start intent-button opening-start" id="beginJourney">意図する</button>
    </div>
  </div>
</article>`}
function journey(){
  const n=now();
  const journeyStart=new Date("2026-07-31T00:00:00");
  const totalDays=Math.round((END-journeyStart)/86400000)+1;
  const passed=Math.max(0,Math.min(totalDays,Math.floor((n-journeyStart)/86400000)+1));
  const pct=Math.round((passed/totalDays)*100);
  const currentText=n<journeyStart?"旅の入口で待っています":n>END?"この旅を歩ききりました":`今日は、旅の${passed}日目。`;
  const stop=(date,dateLabel,title,copy="",cls="")=>{
    const target=new Date(date+"T12:00:00");
    const d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
    const t0=new Date(target.getFullYear(),target.getMonth(),target.getDate());
    const stateClass=d0>t0?"past":d0<t0?"future":"current";
    const action=stateClass==="current" ? ` role="button" tabindex="0" data-goto-today="1" title="今日のページを開く"` : "";
    return `<div class="stop ${cls} ${stateClass}"${action}><div class="stop-date">${dateLabel}${stateClass==="current"?'<span class="now-tag">今ここ</span>':""}</div><div class="stop-title">${title}</div>${copy?`<p class="stop-copy">${copy}</p>`:""}</div>`;
  };
  return `<article class="page journey-page"><div class="journey-wrap">
    <div class="eyebrow">YOUR JOURNEY</div><h2>この旅の、今いる場所。</h2>
    <p class="body">これは予定をこなすための一覧ではなく、今日を意図して歩くための旅のしおりです。</p>
    <div class="progress-card">
      <div class="progress-label">JOURNEY PROGRESS</div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="progress-copy">${currentText}</p>
    </div>
    <div class="timeline">
      <div class="chapter">PREPARATION</div>
      ${stop("2026-07-31","7月31日","準備を楽しむ最後の1日","「まだ始まっていない」を体験できる、最後の日。")}

      <div class="chapter">JOY RETREAT</div>
      ${stop("2026-08-01","8月1日 · DAY 1","委ねて味わうを体験する1日")}
      ${stop("2026-08-02","8月2日 · DAY 2","JOYの幅を体験する1日")}
      ${stop("2026-08-03","8月3日 · DAY 3","今の自分で人生を意図する1日")}

      <div class="chapter">AFTER THE RETREAT</div>
      ${stop("2026-08-04","DAY 1","余韻に浸る1日目")}
      ${stop("2026-08-05","DAY 2","余韻に浸る2日目")}
      ${stop("2026-08-06","DAY 3","余韻に浸る3日目")}
      ${stop("2026-08-08","8月8日","JOY Meeting②","リトリートから1週間。<br>今感じている震えと気づきを受け取る日。","meeting")}

      <div class="chapter">JOY IN EVERYDAY LIFE</div>
      ${stop("2026-08-09","8月9日〜","JOYを日常に育てる","リトリートで受け取った心地よさを、日常の中でさらに育てていく。")}
      ${stop("2026-09-12","9月12日","今思うあなたにとっての人生とは？","この旅の今を、自分の言葉で受け取る日。","meeting")}
    </div>
  </div></article>`}

function daily(d,i){
  const ds=localDateKey(d),k="d_"+ds;
  const date=`${d.getMonth()+1}月${d.getDate()}日`;

  let title="JOYを日常に育てる";
  let subtitle="";
  let story="";

  if(ds==="2026-07-31"){
    title="準備を楽しむ最後の1日";
    story=`<div class="daily-story">
      <p>明日から、JOY RETREATが始まります。</p>
      <p><b>今日が、「まだ始まっていない」を体験できる、最後の日です。</b></p>
      <p>明日を楽しみに待てること。<br>ワクワクを育てられること。<br>波動を温めながら過ごせること。</p>
      <p><b>この時間は、今日しか味わえません。</b></p>
      <p>どうぞ、この「始まる前の幸せ」を、思いっきり味わってください。</p>
    </div>`;
  } else if(ds==="2026-08-01"){
    title="JOY RETREAT Day1"; subtitle="委ねて味わうを体験する1日";
  } else if(ds==="2026-08-02"){
    title="JOY RETREAT Day2"; subtitle="JOYの幅を体験する1日";
  } else if(ds==="2026-08-03"){
    title="JOY RETREAT Day3"; subtitle="今の自分で人生を意図する1日";
  } else if(ds==="2026-08-04"){
    title="Day1"; subtitle="余韻に浸る1日目";
  } else if(ds==="2026-08-05"){
    title="Day2"; subtitle="余韻に浸る2日目";
  } else if(ds==="2026-08-06"){
    title="Day3"; subtitle="余韻に浸る3日目";
  } else if(ds==="2026-08-07"){
    title="Day4"; subtitle="余韻を抱いたまま、日常へ戻る日";
  } else if(ds==="2026-08-08"){
    title="JOY Meeting②";
    subtitle="リトリートから1週間。今感じている震えと気づきを受け取る日";
  } else if(ds==="2026-09-12"){
    title="今思うあなたにとっての人生とは？";
  }

  return `<article class="page daily-page" data-date="${ds}"><div class="spread daily-spread">
    <div class="left">
      <div class="daily-heading">
        <div class="daily-date">${date}</div>
        <div class="daily-kicker">TODAY'S JOURNEY</div>
        <h2 class="daily-title">${title.replace(/[、。]/g,"")}</h2>
        ${subtitle?`<p class="daily-subtitle">${subtitle}</p>`:""}
      </div>
      ${story}
      <div class="daily-fields">
        <div class="daily-field">
          <label><span class="time-label">朝</span><b>今日の意図</b></label>
          ${field(k+"_intent","")}
        </div>
        <div class="daily-field">
          <label><span class="time-label">夜</span><b>今日受け取ったJOY</b></label>
          ${field(k+"_joy","")}
        </div>
      </div>
    </div>
    <div class="right">
      <div class="card little-card">
        <div class="eyebrow">TODAY'S MEMO</div>
        <div class="prompt">今日の気づき</div>
        ${field(k+"_memo","気づき、言葉、アイデア。なんでも自由に。")}
      </div>
    </div>
  </div></article>`}

function finalPage(){
return `<article class="page final-page"><div class="final-layout">
  <div class="final-copy"><div class="eyebrow">THE JOURNEY CONTINUES</div><h2>旅の入口に置いた<br>あなたの意図</h2>
    <div class="intention-echo">
      <div class="eyebrow">FROM YOUR OPENING INTENTION</div>
      <div class="quote">${esc(state.open1)||"ここに、旅のはじまりに置いた、あなたの言葉が戻ってきます。"}</div>
    </div>
    <div class="card body">
      <p><b>受け取りたいと意図した自分</b><br>${esc(state.open1)||"—"}</p>
      <p><b>この旅で大切にしたかったフィーリング</b><br>${esc(state.open2)||"—"}</p>
    </div>
  </div>
  <div class="final-question"><div class="eyebrow">FINAL QUESTION</div>
    <h2 class="final-question-title">今思う、<br>あなたにとっての人生とは？</h2>
    <div class="field">${field("final","今のあなたの言葉で。")}</div>
    <button class="pill cover-start intent-button" id="meetYourself">意図する</button>
    <div class="lovely-reveal" id="lovelyReveal" aria-live="polite">
      <img src="./assets/ui/lovely-final.webp?v=15" alt="絵筆を持ったラブリーくん">
      <p>いってらっしゃい。</p>
    </div>
  </div>
</div></article>`}
function build(){
  let arr=[cover(),opening(),journey()];
  let d=new Date(START),i=0;
  while(d<=END){arr.push(daily(new Date(d),i++));d.setDate(d.getDate()+1)}
  arr.push(finalPage());
  pages.innerHTML=arr.join("");
  bind();
}
function bind(){
  document.querySelectorAll("[data-key]").forEach(el=>{
    if(el.classList.contains("sw")) el.onclick=()=>{state[el.dataset.key]=el.dataset.color;save();build();show(current)};
    else el.oninput=()=>{state[el.dataset.key]=el.value;save()};
  });
  document.getElementById("coverStart")?.addEventListener("click",()=>show(1));
  document.getElementById("beginJourney")?.addEventListener("click",()=>show(2));
  document.getElementById("meetYourself")?.addEventListener("click",()=>{
    state.finalRevealed=true;
    save();
    document.getElementById("lovelyReveal")?.classList.add("show");
  });
  if(state.finalRevealed) document.getElementById("lovelyReveal")?.classList.add("show");
}
function save(){
  localStorage.setItem(storageKey,JSON.stringify(state));
  localStorage.setItem("joyPage_"+VERSION,current);
  toast.style.display="block";clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>toast.style.display="none",700);
}
function now(){return previewDate.value?new Date(previewDate.value+"T23:59:59"):new Date()}
function max(){
  return document.querySelectorAll(".page").length-1;
}
function show(i){
  const all=[...document.querySelectorAll(".page")];
  current=Math.max(0,Math.min(i,max()));
  all.forEach((p,n)=>p.classList.toggle("active",n===current));
  prev.disabled=current===0;next.disabled=current===max();
  num.textContent=`${current+1} / ${all.length}`;
  localStorage.setItem("joyPage_"+VERSION,current);
  window.scrollTo({top:0,behavior:"smooth"});
}
function shelfBuild(){
  const dailyPages=[...document.querySelectorAll('.page[data-date]')];
  shelf.innerHTML='<div class="life-shelf" aria-label="45日分の本棚"></div>';
  const grid=shelf.querySelector('.life-shelf');
  const coverTypes=['paint','tape','doodle','paper','confetti','wash'];
  const sizes=['small','medium','tall','medium','wide'];
  dailyPages.forEach((page,i)=>{
    const ds=page.dataset.date;
    const [,m,d]=ds.split('-').map(Number);
    const b=document.createElement('button');
    b.type='button';
    const type=coverTypes[(i*5+2)%coverTypes.length];
    const size=sizes[(i*3+1)%sizes.length];
    const tilt=((i*7)%9)-4;
    b.className=`life-book cover-${type} size-${size}`;
    b.style.setProperty('--tilt',`${tilt}deg`);
    b.style.setProperty('--delay',`${(i%7)*-0.13}s`);
    b.innerHTML=`<span class="book-date">${m}/${d}</span><span class="book-mark" aria-hidden="true"></span>`;
    b.setAttribute('aria-label',`${m}月${d}日を開く`);
    b.addEventListener('click',()=>{
      const index=[...document.querySelectorAll('.page')].indexOf(page);
      show(index);
      shelfOverlay.classList.remove('open');
    });
    grid.appendChild(b);
  });
}
prev.onclick=()=>show(current-1);
next.onclick=()=>show(current+1);
shelfBtn.onclick=()=>{shelfBuild();shelfOverlay.classList.add("open")};
settingsBtn.onclick=()=>settingsOverlay.classList.add("open");
document.querySelectorAll(".close").forEach(b=>b.onclick=()=>b.closest(".overlay").classList.remove("open"));
previewDate.onchange=()=>{build();show(Math.min(current,max()))};
reset.onclick=()=>{if(confirm("この端末に保存した入力をすべて消しますか？")){localStorage.removeItem(storageKey);localStorage.removeItem("joyPage_"+VERSION);location.reload()}};
build();show(current);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=v15"));

// v0.6 interactions
function openCurrentToday(){
  const n=now();
  const pageCount=document.querySelectorAll(".page").length;
  let idx=3+Math.floor((n-START)/86400000);
  idx=Math.max(3,Math.min(pageCount-2,idx));
  show(idx);
}
document.addEventListener("click",(e)=>{
  const stop=e.target.closest?.("[data-goto-today]");
  if(stop) openCurrentToday();
});
document.addEventListener("keydown",(e)=>{
  if((e.key==="Enter"||e.key===" ") && e.target.matches?.("[data-goto-today]")){
    e.preventDefault(); openCurrentToday();
  }
});
let saveToastTimer;
document.addEventListener("input",(e)=>{
  if(!e.target.matches("textarea,input")) return;
  clearTimeout(saveToastTimer);
  saveToastTimer=setTimeout(()=>{
    const toast=document.getElementById("saveReceived");
    if(!toast) return;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1100);
  },450);
});

</script>
<div class="save-received" id="saveReceived">受け取りました。</div>
</body>
</html>
